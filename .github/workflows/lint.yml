name: Code Quality Check

# 触发条件：当你 push 代码或提交 Pull Request 到 main 分支时
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Check
        # 检查代码逻辑错误、未使用的变量等
        run: ruff check .

      - name: Run Ruff Format
        # 检查代码缩进、空格等格式是否符合 PEP 8 规范
        run: ruff format --check .